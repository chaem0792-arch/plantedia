<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 식물 탐험대! - 이분검색표 게임</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #81c784;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 📌 상단 바 & 홈 버튼 (화면 왼쪽 상단 고정) */
        .top-bar {
            position: fixed;   /* 화면 전체 기준으로 위치 고정 */
            top: 20px;         /* 위쪽 여백 */
            left: 20px;        /* 왼쪽 여백 */
            z-index: 1000;     /* 다른 요소 위에 표시 */
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ffffff;
            color: #444;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 1px solid #dcdcdc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .home-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-top: 20px; /* 고정 버튼과 간격 유지 */
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .step-badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: var(--primary-color);
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.05rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
        }

        .result-box {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-box h2 {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .plant-name {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .plant-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .action-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-restart {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-restart:hover {
            background-color: var(--primary-hover);
        }

        .btn-detail {
            background-color: #fff;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            text-decoration: none;
            display: inline-block;
        }

        .btn-detail:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-back {
            background-color: #eee;
            color: #555;
        }

        .btn-back:hover {
            background-color: #ddd;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 📌 화면 왼쪽 상단에 항상 고정되는 홈 버튼 영역 -->
    <div class="top-bar">
        <a href="./index.html" id="home-link" class="home-btn">🏠 홈으로</a>
    </div>

    <div class="container">
        <header>
            <h1>🌿 학교 식물 탐험대</h1>
            <p>질문에 답을 선택하며 학교 안 식물의 이름을 찾아보세요!</p>
        </header>

        <!-- Quiz Mode -->
        <div id="quiz-box">
            <div class="step-badge" id="step-badge">단계 1</div>
            <div class="question-text">관찰하고 있는 식물의 특징을 선택하세요.</div>
            
            <div class="options-container">
                <button class="option-btn" id="opt-a" onclick="selectOption('a')">
                    <span id="text-a"></span>
                    <span>➔</span>
                </button>
                <button class="option-btn" id="opt-b" onclick="selectOption('b')">
                    <span id="text-b"></span>
                    <span>➔</span>
                </button>
            </div>

            <div class="btn-group" style="margin-top: 20px;">
                <button class="action-btn btn-back" id="back-btn" onclick="goBack()" style="display: none;">⬅ 이전으로</button>
            </div>
        </div>

        <!-- Result Mode -->
        <div id="result-box" class="result-box">
            <div class="plant-icon">🌱</div>
            <h2>찾은 식물 이름</h2>
            <div class="plant-name" id="plant-name">식물 이름</div>
            
            <div class="btn-group">
                <button class="action-btn btn-back" onclick="goBack()">⬅ 이전으로</button>
                <a class="action-btn btn-detail" id="detail-link" href="#">📖 상세 페이지 보기</a>
                <button class="action-btn btn-restart" onclick="restart()">🔄 다시 찾기</button>
            </div>
        </div>
    </div>

<script src="./js/plant-key.js"></script>
<script>
    // 🔗 [설정] 이동하려는 홈 페이지 URL을 아래에 입력하세요.
    const HOME_URL = "index.html"; 

    // 홈 버튼 링크 연결 설정
    document.getElementById('home-link').href = HOME_URL;

    let currentStep = 1;
    let history = [];

    function updateQuiz() {
        const stepData = keyData[currentStep];
        
        document.getElementById('step-badge').innerText = `Step ${currentStep}`;
        document.getElementById('text-a').innerText = `A. ${stepData.a[0]}`;
        document.getElementById('text-b').innerText = `B. ${stepData.b[0]}`;

        // 뒤로가기 버튼 표시 여부
        document.getElementById('back-btn').style.display = history.length > 0 ? 'inline-block' : 'none';
    }

    function selectOption(choice) {
        history.push(currentStep);
        const next = keyData[currentStep][choice][1];

        if (typeof next === 'string') {
            showResult(next);
        } else {
            currentStep = next;
            updateQuiz();
        }
    }

    function goBack() {
        if (history.length > 0) {
            currentStep = history.pop();
            document.getElementById('quiz-box').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            updateQuiz();
        }
    }

    function showResult(plantName) {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('plant-name').innerText = plantName;
        // 상세 페이지 링크 연결: ./indivisualTree/나무이름.html
        document.getElementById('detail-link').href = detailPageUrl(plantName);
    }

    function restart() {
        currentStep = 1;
        history = [];
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        updateQuiz();
    }

    // 초기화 실행
    updateQuiz();
</script>

</body>
</html>
