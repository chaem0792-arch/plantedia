<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 식물 탐험대! - 이분검색표 게임</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #81c784;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Bar & Home Button */
        .top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 15px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f0f4f8;
            color: #444;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 1px solid #dcdcdc;
        }

        .home-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .step-badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: var(--primary-color);
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.05rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
        }

        .result-box {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-box h2 {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .plant-name {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .plant-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .action-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-restart {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-restart:hover {
            background-color: var(--primary-hover);
        }

        .btn-back {
            background-color: #eee;
            color: #555;
        }

        .btn-back:hover {
            background-color: #ddd;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
 <!-- 왼쪽 상단 홈으로 버튼 영역 -->
    <div class="top-bar">
        <a href="./index.html" id="home-link" class="home-btn">🏠 홈으로</a>
    </div>
<div class="container">
   

    <header>
        <h1>🌿 학교 식물 탐험대</h1>
        <p>질문에 답을 선택하며 학교 안 식물의 이름을 찾아보세요!</p>
    </header>

    <!-- Quiz Mode -->
    <div id="quiz-box">
        <div class="step-badge" id="step-badge">단계 1</div>
        <div class="question-text">관찰하고 있는 식물의 특징을 선택하세요.</div>
        
        <div class="options-container">
            <button class="option-btn" id="opt-a" onclick="selectOption('a')">
                <span id="text-a"></span>
                <span>➔</span>
            </button>
            <button class="option-btn" id="opt-b" onclick="selectOption('b')">
                <span id="text-b"></span>
                <span>➔</span>
            </button>
        </div>

        <div class="btn-group" style="margin-top: 20px;">
            <button class="action-btn btn-back" id="back-btn" onclick="goBack()" style="display: none;">⬅ 이전으로</button>
        </div>
    </div>

    <!-- Result Mode -->
    <div id="result-box" class="result-box">
        <div class="plant-icon">🌱</div>
        <h2>찾은 식물 이름</h2>
        <div class="plant-name" id="plant-name">식물 이름</div>
        
        <div class="btn-group">
            <button class="action-btn btn-back" onclick="goBack()">⬅ 이전으로</button>
            <button class="action-btn btn-restart" onclick="restart()">🔄 다시 찾기</button>
        </div>
    </div>
</div>

<script>
    // 🔗 [설정] 이동하려는 홈 페이지 URL을 아래에 입력하세요.
    const HOME_URL = "index.html"; 

    // 홈 버튼 링크 연결 설정
    document.getElementById('home-link').href = HOME_URL;

    // 이분검색표 데이터베이스
    const keyData = {
        1: { a: ["줄기가 감거나 타고 올라간다", 2], b: ["스스로 곧게 자란다", 3] },
        2: { a: ["잎이 한 장씩 달린다", "계요등"], b: ["작은 잎이 여러 장 달린다", "능소화"] },
        3: { a: ["줄기에 마디가 뚜렷하고 속이 비어 있다", "대나무"], b: ["마디가 없는 목질 줄기", 4] },
        4: { a: ["잎이 바늘·침·비늘 모양", 5], b: ["잎이 넓은 판 모양", 13] },
        5: { a: ["가을에 모든 잎이 떨어짐", "메타세콰이어"], b: ["사계절 푸른 상록", 6] },
        6: { a: ["잎이 2개 또는 5개씩 다발로 묶임", 7], b: ["잎이 하나씩 나거나 비늘처럼 붙음", 9] },
        7: { a: ["잎이 2개씩 묶임", "소나무"], b: ["잎이 5개씩 묶임", 8] },
        8: { a: ["잎이 길고 부드러운 느낌", "오엽송"], b: ["잎이 짧고 굵음", "섬잣나무"] },
        9: { a: ["잎이 납작하고 부드러우며 붉은 열매 같은 부분이 보임", "주목"], b: ["그렇지 않음", 10] },
        10: { a: ["잎과 가지가 실처럼 가늘고 늘어남", "실화백"], b: ["그렇지 않음", 11] },
        11: { a: ["가지가 납작한 평면으로 퍼짐", "측백나무"], b: ["가지가 입체적으로 퍼짐", 12] },
        12: { a: ["만지면 향이 강함", "향나무"], b: ["향이 약하거나 없음", "가문비나무"] },
        13: { a: ["잎이 부채 모양", "은행나무"], b: ["잎이 부채 모양 아님", 14] },
        14: { a: ["작은 잎이 여러 장 모인 겹잎", 15], b: ["한 장짜리 홑잎", 21] },
        15: { a: ["한 점에서 잎 5~7장이 손바닥처럼 퍼짐", "칠엽수"], b: ["깃꼴로 배열된 겹잎", 16] },
        16: { a: ["작은 잎이 매우 많고 두 번 깃꼴로 갈라짐", "자귀나무"], b: ["한 번 깃꼴로 갈라짐", 17] },
        17: { a: ["줄기·가지에 가시 있음", 18], b: ["가시 없음", 20] },
        18: { a: ["줄기가 낮고 퍼지며 잎이 두껍고 주름짐", "만첩해당화"], b: ["그렇지 않음", 19] },
        19: { a: ["가지가 불규칙하게 휘고 가시가 뚜렷함", "장미 또는 월계화"], b: ["가지가 곧고 가시가 작음", "찔레"] },
        20: { a: ["잎이 매우 크고 문지르면 냄새 강함", "가죽나무"], b: ["관목이고 잎이 마주남", "딱총나무"] },
        21: { a: ["잎이 손바닥처럼 깊게 갈라짐", 22], b: ["잎이 갈라지지 않거나 약함", 26] },
        22: { a: ["사계절 푸르고 잎이 매우 두꺼움", "팔손이"], b: ["가을에 잎이 떨어짐", 23] },
        23: { a: ["잎 갈래가 가늘고 깊음", "공작단풍"], b: ["잎 갈래가 비교적 넓음", 24] },
        24: { a: ["잎이 마주나고 가을색이 선명", "단풍"], b: ["잎이 어긋남", 25] },
        25: { a: ["잎이 극도로 깊게 갈라져 거의 분리된 모양", "모란"], b: ["한 나무에 잎 형태가 다양함 (단엽, 2갈래, 5갈래 등)", "뽕나무"] },
        26: { a: ["잎이 마주남", 27], b: ["잎이 어긋남", 35] },
        27: { a: ["사계절 잎이 남음 (상록)", 28], b: ["겨울에 잎이 떨어짐 (낙엽)", 30] },
        28: { a: ["잎이 아주 작고 두껍고 가지가 빽빽함", "회양목"], b: ["잎이 그보다 큼", 29] },
        29: { a: ["잎 가장자리에 잔톱니 있고 광택 있음", "사철나무"], b: ["잎이 매끈하고 윤기 있음", "쥐똥나무"] },
        30: { a: ["가지가 노란색 또는 윤기나는 갈색", "개나리"], b: ["가지가 다른 색", 31] },
        31: { a: ["잎맥이 활처럼 휘고 잎이 길쭉함", "산수유"], b: ["그렇지 않음", 32] },
        32: { a: ["나무껍질이 매끈하고 얼룩처럼 벗겨짐", "배롱나무"], b: ["나무껍질이 그렇지 않음", 33] },
        33: { a: ["잎이 반대쪽에 붙어 나고 가지 색이 자주색", "작살나무"], b: ["그렇지 않음", 34] },
        34: { a: ["가지가 층층이 수평으로 퍼짐 (윤생)", "층층나무"], b: ["가지가 그렇지 않음", "석류나무"] },
        35: { a: ["사계절 푸르고 잎이 두껍고 광택 있음", "동백나무"], b: ["낙엽성", 36] },
        36: { a: ["가지에 가시 있고 잎이 작음", "명자나무"], b: ["가시 없음", 37] },
        37: { a: ["잎이 길쭉한 타원형 또는 피침형", 38], b: ["잎이 둥근 또는 다른 모양", 45] },
        38: { a: ["잎이 좁고 끝이 뾰족함 (시침형)", "진달래"], b: ["잎이 더 넓은 타원형", 39] },
        39: { a: ["잎이 매우 길고 좁으며 광택 없음 (꽃/열매 확인)", "복사나무"], b: ["잎이 넓고 주름져 있음", 40] },
        40: { a: ["나무껍질에 가로 줄무늬가 뚜렷함", "벚나무"], b: ["나무껍질이 부드럽고 매끈함", 41] },
        41: { a: ["관목이고 잎이 매우 작음 (꽃/열매 확인)", "앵도나무"], b: ["큰키 나무이고 잎이 더 큼", 42] },
        42: { a: ["잎이 넓은 달걀 모양이고 거침", "살구나무"], b: ["잎이 더 길고 광택 있음", "매화나무"] },
        45: { a: ["잎 뒷면이 은빛처럼 보임", "뜰보리수"], b: ["그렇지 않음", 46] },
        46: { a: ["잎 가장자리가 거의 밋밋하고 매끄러움", "감나무"], b: ["잎에 톱니 있음", 47] },
        47: { a: ["큰 그늘나무이고 잎 밑부분이 비대칭", "느티나무"], b: ["그렇지 않음", 48] },
        48: { a: ["관목이고 한 나무에 잎 형태가 다양함", "무궁화"], b: ["잎 형태가 비교적 일정함", "모과"] }
    };

    let currentStep = 1;
    let history = [];

    function updateQuiz() {
        const stepData = keyData[currentStep];
        
        document.getElementById('step-badge').innerText = `Step ${currentStep}`;
        document.getElementById('text-a').innerText = `A. ${stepData.a[0]}`;
        document.getElementById('text-b').innerText = `B. ${stepData.b[0]}`;

        // 뒤로가기 버튼 표시 여부
        document.getElementById('back-btn').style.display = history.length > 0 ? 'inline-block' : 'none';
    }

    function selectOption(choice) {
        history.push(currentStep);
        const next = keyData[currentStep][choice][1];

        if (typeof next === 'string') {
            showResult(next);
        } else {
            currentStep = next;
            updateQuiz();
        }
    }

    function goBack() {
        if (history.length > 0) {
            currentStep = history.pop();
            document.getElementById('quiz-box').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            updateQuiz();
        }
    }

    function showResult(plantName) {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('plant-name').innerText = plantName;
    }

    function restart() {
        currentStep = 1;
        history = [];
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        updateQuiz();
    }

    // 초기화 실행
    updateQuiz();
</script>

</body>
</html>
