<!--김지후-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감나무 소개</title>

  <style>
    /* ===== 전체 페이지 디자인 ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: #fffaf3; /* 페이지 배경색 */
      font-family: "Malgun Gothic", sans-serif;
      color: #493629;
    }

    /* ===== 왼쪽 사진 + 오른쪽 설명 배치 ===== */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ===== 왼쪽 사진 카드 ===== */
    .photo-card {
      min-height: 570px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(145deg, #f9c66b, #f5a34c);
      position: relative;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      min-height: 570px;
      display: block;
      object-fit: cover;
    }

    /* 사진이 없을 때 나타나는 안내 문구 */
    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #754321;
      pointer-events: none;
    }

    .photo-placeholder .fruit {
      font-size: 90px;
      margin-bottom: 12px;
    }

    .photo-placeholder p {
      font-size: 20px;
      font-weight: bold;
    }

    /* ===== 오른쪽 설명 카드 ===== */
    .info-card {
      min-height: 570px;
      padding: 40px;
      border-radius: 24px;
      background-color: #fff0dc;
    }

    /* 나무 이름 - 여기서 수정하세요! */
    h1 {
      margin: 0 0 14px;
      font-size: 44px;
      color: #a64b18;
      font-weight: 800;
      letter-spacing: -2px;
    }

    /* 나무 소개 문장 */
    .description {
      font-size: 19px;
      line-height: 1.8;
      margin: 0 0 28px;
      color: #594332;
      word-break: keep-all;
    }

    /* 특징 제목 */
    h2 {
      font-size: 25px;
      color: #a64b18;
      margin: 0 0 16px;
    }

    /* 특징 목록 */
    .features {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .features li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 4px;
      border-top: 1px dashed #e4c7a8;
      font-size: 18px;
      line-height: 1.8;
      word-break: keep-all;
    }

    /* 감 열매 아이콘 */
    .features li::before {
      content: "🍊";
      flex-shrink: 0;
      font-size: 17px;
      padding-top: 2px;
    }

    /* ===== 작은 화면에서도 보기 좋게 ===== */
    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .photo-card,
      .photo-card img {
        min-height: 350px;
      }

      .info-card {
        min-height: auto;
        padding: 28px;
      }

      h1 {
        font-size: 36px;
      }

      .description {
        font-size: 17px;
      }

      .features li {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- ===== 왼쪽: 감나무 사진 ===== -->
    <section class="photo-card">

      <!-- gamnamu.jpg를 원하는 감나무 사진으로 교체하세요. -->
      <img
        src="gamnamu.jpg"
        alt="감나무 사진"
        onerror="this.style.display='none'"
      >

      <!-- 사진이 없을 때 보여 주는 기본 화면 -->
      <div class="photo-placeholder">
        <div class="fruit">🌳 🟠</div>
        <p>가을을 담은 감나무</p>
      </div>

    </section>

    <!-- ===== 오른쪽: 감나무 정보 ===== -->
    <section class="info-card">

      <!-- 1. 나무 이름 수정 -->
      <h1>감나무</h1>

      <!-- 2. 나무 소개 문장 수정 -->
      <p class="description">
        가을이 되면 주황빛 열매가 탐스럽게 익어 가는,
        우리에게 친숙하고 아름다운 나무예요.
      </p>

      <!-- 3. 특징 제목 수정 -->
      <h2>특징</h2>

      <!-- 4. 아래 목록에서 특징을 자유롭게 수정하세요 -->
      <ul class="features">
        <li>
          감나무는 봄에 새잎이 나고 여름에는
          초록빛 잎이 무성하게 자라요.
        </li>

        <li>
          가을이 되면 감 열매가 주황색으로 익으며,
          단감과 떫은감 등 다양한 종류가 있어요.
        </li>

        <li>
          감나무는 낙엽이 지는 나무로,
          잘 자라면 오랫동안 열매를 맺을 수 있어요.
        </li>
      </ul>

    </section>
  </main>
</body>
</html>
