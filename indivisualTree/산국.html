<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✏️ [수정 1] 브라우저 탭에 보이는 제목 -->
<title>산국</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== 기본 설정 ===== */
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f8f8f5;
    color: #333;
    font-family: "Noto Sans KR", sans-serif;
    word-break: keep-all;  /* 한글이 단어 중간에서 끊기지 않게 */
}

/* ===== 전체 카드: 왼쪽 사진 / 오른쪽 정보 ===== */
.tree-card {
    width: 90%;
    max-width: 1000px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: stretch;
}

/* ===== 왼쪽: 나무 사진 ===== */
.tree-photo {
    background: #edf2ed;
    border-radius: 18px;
    min-height: 460px;
    overflow: hidden;
}

.tree-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ===== 오른쪽: 이름 + 특징 ===== */
.tree-info {
    background: #e8eee9;
    border-radius: 18px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tree-name {
    margin: 0 0 6px;
    font-family: "Jua", sans-serif;
    font-size: 40px;
    color: #355443;
    letter-spacing: 1px;
}

.tree-summary {
    margin: 0 0 24px;
    font-size: 17px;
    line-height: 1.7;
    color: #4b514d;
}

.feature-title {
    font-family: "Jua", sans-serif;
    font-size: 23px;
    color: #42604d;
    margin-bottom: 10px;
}

.feature-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.feature-list li {
    font-size: 16px;
    line-height: 1.7;
    color: #4b514d;
    padding: 8px 0 8px 28px;
    position: relative;
    border-top: 1px dashed #c9d6cc;
}

.feature-list li::before {
    content: "🌿";
    position: absolute;
    left: 0;
    top: 8px;
    font-size: 15px;
}

/* ===== 모바일: 사진 위, 정보 아래 ===== */
@media (max-width: 700px) {
    .tree-card { width: 92%; grid-template-columns: 1fr; margin: 25px auto; gap: 16px; }
    .tree-photo { min-height: 320px; }
    .tree-info { padding: 26px 22px; }
    .tree-name { font-size: 32px; }
    .tree-summary { font-size: 15px; }
    .feature-list li { font-size: 15px; }
}
</style>
</head>
<body>

<main class="tree-card">

    <!-- ===== 왼쪽: 나무 사진 ===== -->
    <section class="tree-photo">
        <!-- ✏️ [수정 2] 사진 경로(src)와 설명(alt) -->
        <img src="../images/산국.JPG" alt="산국 사진">
    </section>

    <!-- ===== 오른쪽: 나무 정보 ===== -->
    <section class="tree-info">

        <!-- ✏️ [수정 3] 나무 이름 -->
        <h1 class="tree-name">산국/h1>

        <!-- ✏️ [수정 4] 한두 문장 요약 -->
        <p class="tree-summary">
            가을에 작고 노란 꽃을 풍성하게 피우는 국화과의 여러해살이풀이예요.
        </p>

        <div class="feature-title">특징</div>

        <!-- ✏️ [수정 5] 특징 목록: <li>…</li> 한 줄이 항목 하나예요. 늘리거나 지워도 돼요. -->
        <ul class="feature-list">
            <li>줄기 끝에 작은 노란색 꽃들이 여러 송이 모여 피어요.</li>
            <li>주로 가을에 꽃이 피며, 산과 들의 햇볕이 잘 드는 곳에서 자라요.</li>
            <li>잎 가장자리가 깊게 갈라지고 톱니 모양을 띠며, 식물 전체에서 특유의 향이 나요.</li>
        </ul>

    </section>

</main>

</body>
</html>
