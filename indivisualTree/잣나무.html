<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✏️ [수정 1] 브라우저 탭에 보이는 제목 -->
<title>잣나무</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== 기본 설정 ===== */
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f8f8f5;
    color: #333;
    font-family: "Noto Sans KR", sans-serif;
    word-break: keep-all;  /* 한글이 단어 중간에서 끊기지 않게 */
}

/* ===== 전체 카드: 왼쪽 사진 / 오른쪽 정보 ===== */
.tree-card {
    width: 90%;
    max-width: 1000px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: stretch;
}

/* ===== 왼쪽: 나무 사진 ===== */
.tree-photo {
    background: #edf2ed;
    border-radius: 18px;
    min-height: 460px;
    overflow: hidden;
}

.tree-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ===== 오른쪽: 이름 + 특징 ===== */
.tree-info {
    background: #e8eee9;
    border-radius: 18px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tree-name {
    margin: 0 0 6px;
    font-family: "Jua", sans-serif;
    font-size: 40px;
    color: #355443;
    letter-spacing: 1px;
}

.tree-summary {
    margin: 0 0 24px;
    font-size: 17px;
    line-height: 1.7;
    color: #4b514d;
}

.feature-title {
    font-family: "Jua", sans-serif;
    font-size: 23px;
    color: #42604d;
    margin-bottom: 10px;
}

.feature-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.feature-list li {
    font-size: 16px;
    line-height: 1.7;
    color: #4b514d;
    padding: 8px 0 8px 28px;
    position: relative;
    border-top: 1px dashed #c9d6cc;
}

.feature-list li::before {
    content: "🌿";
    position: absolute;
    left: 0;
    top: 8px;
    font-size: 15px;
}

/* ===== 모바일: 사진 위, 정보 아래 ===== */
@media (max-width: 700px) {
    .tree-card { width: 92%; grid-template-columns: 1fr; margin: 25px auto; gap: 16px; }
    .tree-photo { min-height: 320px; }
    .tree-info { padding: 26px 22px; }
    .tree-name { font-size: 32px; }
    .tree-summary { font-size: 15px; }
    .feature-list li { font-size: 15px; }
}

/* ===== 외부(위키미디어 공용) 사진: 흑백 표시 + 출처 ===== */
.tree-photo--external { position: relative; }
.tree-photo--external img { filter: grayscale(100%); }
.photo-credit {
    position: absolute; left: 0; right: 0; bottom: 0;
    margin: 0; padding: 6px 12px;
    font-size: 12px; line-height: 1.5; color: #fff;
    background: rgba(0, 0, 0, 0.55);
}
.photo-credit a { color: #fff; }
</style>
</head>
<body>

<main class="tree-card">

    <!-- ===== 왼쪽: 나무 사진 ===== -->
    <section class="tree-photo tree-photo--external">
        <!-- 직접 찍은 사진이 없어 위키미디어 공용 사진을 흑백으로 보여 줘요. 출처: images/commons/README.md -->
        <img src="../images/commons/잣나무.jpg" alt="잣나무 사진 (흑백)">
        <p class="photo-credit">사진: Original: Olga Ukhvatkina; edit: MPF · <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a> · <a href="https://commons.wikimedia.org/wiki/File:Pinus_koraiensis,_Cheremshany,_Sikhote_Alin,_Russia.jpg" target="_blank" rel="noopener">위키미디어 공용</a> · 흑백으로 바꿈</p>
    </section>

    <!-- ===== 오른쪽: 나무 정보 ===== -->
    <section class="tree-info">

        <!-- ✏️ [수정 3] 나무 이름 -->
        <h1 class="tree-name">잣나무</h1>

        <!-- ✏️ [수정 4] 한두 문장 요약 -->
        <p class="tree-summary">
            사계절 푸른 잎을 유지하며, 잣이 들어 있는 솔방울을 맺는 상록 침엽수예요.
        </p>

        <div class="feature-title">특징</div>

        <!-- ✏️ [수정 5] 특징 목록: <li>…</li> 한 줄이 항목 하나예요. 늘리거나 지워도 돼요. -->
        <ul class="feature-list">
            <li>가늘고 긴 바늘잎이 5개씩 한 묶음으로 자라요.</li>
            <li>꽃이 핀 뒤에는 크고 길쭉한 솔방울이 달려요.</li>
            <li>솔방울 속 씨앗인 잣은 식용으로 이용되며, 소나무와 구별하는 중요한 특징이에요.</li>
        </ul>

    </section>

</main>

<script src="../js/plant-key.js"></script>
<script src="../js/key-path-menu.js"></script>
</body>
</html>
