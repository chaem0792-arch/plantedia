<!-- 채민서 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✏️ [수정 1] 브라우저 탭에 보이는 제목 -->
<title>향나무</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== 기본 설정 ===== */
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f5f6f1;
    color: #333;
    font-family: "Noto Sans KR", sans-serif;
    word-break: keep-all;  /* 한글이 단어 중간에서 끊기지 않게 */
}

/* ===== 전체 카드: 왼쪽 사진 / 오른쪽 정보 ===== */
.tree-card {
    width: 90%;
    max-width: 1000px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: stretch;
}

/* ===== 왼쪽: 나무 사진 ===== */
.tree-photo {
    background: #e5eadf;
    border-radius: 18px;
    min-height: 460px;
    overflow: hidden;
}

.tree-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ===== 오른쪽: 이름 + 특징 ===== */
.tree-info {
    background: #e0e8d8;
    border-radius: 18px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tree-name {
    margin: 0 0 6px;
    font-family: "Jua", sans-serif;
    font-size: 40px;
    color: #344b32;
    letter-spacing: 1px;
}

.tree-summary {
    margin: 0 0 24px;
    font-size: 17px;
    line-height: 1.7;
    color: #4b514d;
}

.feature-title {
    font-family: "Jua", sans-serif;
    font-size: 23px;
    color: #4c6540;
    margin-bottom: 10px;
}

.feature-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.feature-list li {
    font-size: 16px;
    line-height: 1.7;
    color: #4b514d;
    padding: 8px 0 8px 28px;
    position: relative;
    border-top: 1px dashed #bdcbb4;
}

.feature-list li::before {
    content: "🌿";
    position: absolute;
    left: 0;
    top: 8px;
    font-size: 15px;
}

/* ===== 모바일: 사진 위, 정보 아래 ===== */
@media (max-width: 700px) {
    .tree-card { width: 92%; grid-template-columns: 1fr; margin: 25px auto; gap: 16px; }
    .tree-photo { min-height: 320px; }
    .tree-info { padding: 26px 22px; }
    .tree-name { font-size: 32px; }
    .tree-summary { font-size: 15px; }
    .feature-list li { font-size: 15px; }
}
</style>
</head>
<body>

<main class="tree-card">

    <!-- ===== 왼쪽: 나무 사진 ===== -->
    <section class="tree-photo">
        <!-- ✏️ [수정 2] 사진 경로(src)와 설명(alt) -->
        <img src="../images/향나무.JPG" alt="향나무 사진">
    </section>

    <!-- ===== 오른쪽: 나무 정보 ===== -->
    <section class="tree-info">

        <!-- ✏️ [수정 3] 나무 이름 -->
        <h1 class="tree-name">향나무</h1>

        <!-- ✏️ [수정 4] 한두 문장 요약 -->
        <p class="tree-summary">
           사계절 내내 푸른 잎을 유지하는 상록 침엽수로, 향긋한 나무 향과 독특한 수형이 특징인 나무예요.
        </p>

        <div class="feature-title">특징</div>

        <!-- ✏️ [수정 5] 특징 목록: <li>…</li> 한 줄이 항목 하나예요. 늘리거나 지워도 돼요. -->
        <ul class="feature-list">
            <li>바늘 모양 또는 비늘 모양의 잎이 촘촘하게 달리며, 사계절 내내 푸른빛을 띠어요.</li>
    <li>가지와 잎에서 특유의 향이 나며, 가지가 여러 방향으로 뻗어 다양한 수형을 이루어요.</li>
    <li>열매처럼 보이는 구과는 처음에는 초록빛을 띠다가 익으면서 검푸른색으로 변해요.</li>
    <li>생명력이 강하고 가지치기에 잘 견뎌 정원수나 조경수, 분재로 널리 활용돼요.</li>
        </ul>

    </section>

</main>

</body>
</html>
