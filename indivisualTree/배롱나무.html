<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배롱나무</title>

<!-- 귀여운 한글 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== 기본 설정 ===== */
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f8f8f5;
    color: #333;
    font-family: "Noto Sans KR", sans-serif;
}

/* ===== 전체 나무 소개 카드 ===== */
.tree-card {
    width: 90%;
    max-width: 1100px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    grid-template-rows: auto 1fr;
    gap: 18px;
}

/* ===== 나무 이름 ===== */
.tree-name {
    background: #dce8df;
    border-radius: 18px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Jua", sans-serif;
    font-size: 36px;
    color: #355443;
    letter-spacing: 1px;
}

/* ===== 나무 사진 ===== */
.tree-photo {
    background: #edf2ed;
    border-radius: 18px;
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.tree-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* 사진이 아직 없을 때 */
.photo-placeholder {
    color: #8b9990;
    font-size: 18px;
}

/* ===== 오른쪽 정보 박스 ===== */
.info-box {
    background: #e8eee9;
    border-radius: 18px;
    padding: 30px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.info-title {
    font-family: "Jua", sans-serif;
    font-size: 25px;
    color: #42604d;
    margin-bottom: 12px;
}

.info-text {
    font-size: 17px;
    line-height: 1.8;
    color: #4b514d;
    white-space: pre-line;
}

/* ===== 오른쪽 영역 배치 ===== */
.right-column {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 18px;
}

/* ===== 작은 장식 ===== */
.info-box::before {
    content: "🌿";
    font-size: 18px;
    margin-bottom: 5px;
}

/* ===== 모바일 ===== */
@media (max-width: 700px) {
    .tree-card { width: 92%; display: flex; flex-direction: column; margin: 25px auto; }
    .tree-name { min-height: 80px; font-size: 30px; }
    .tree-photo { min-height: 350px; }
    .right-column { display: flex; flex-direction: column; }
    .info-box { min-height: 130px; padding: 24px; }
    .info-title { font-size: 22px; }
    .info-text { font-size: 15px; }
}
</style>
</head>
<body>

<main class="tree-card">

    <!-- 나무 이름 -->
    <section class="tree-name">
        배롱나무
    </section>

    <!-- 관찰 포인트 -->
    <section class="info-box">
        <div class="info-title">관찰 포인트</div>
        <div class="info-text">
            매끈하고 얼룩덜룩한 나무껍질
        </div>
    </section>

    <!-- 나무 사진 -->
    <section class="tree-photo">
        <img src="../images/본관 왼편 배롱나무.JPG" alt="배롱나무 사진">
    </section>

    <!-- 오른쪽 정보 -->
    <section class="right-column">

        <div class="info-box">
            <div class="info-title">주요 특징</div>
            <div class="info-text">
                매끈한 수피가 특징이며 껍질이 벗겨지면서 여러 색이 나타납니다.
            </div>
        </div>

        <div class="info-box">
            <div class="info-title">꽃·열매</div>
            <div class="info-text">
                여름에 분홍·붉은색 꽃이 오랫동안 피어 백일홍나무라고도 합니다.
            </div>
        </div>

        <div class="info-box">
            <div class="info-title">나무 이야기</div>
            <div class="info-text">
                그거 아셨나요? 배롱나무는 생각보다 오래 산답니다.
                우리나라의 오래된 사찰이나 정원에 가면 수백 년 된 배롱나무도 볼 수 있어요!
            </div>
        </div>

    </section>

</main>

</body>
</html>
